<h3 class="text-center">Users CRUD</h3>

<button (click)="fetchUsers()">Fetch users</button>

<div class="container">
  <div class="row">
    <div class="col-sm-8">
      <table class="table table-bordered">
        <tbody>
          @for (user of user$ | async; track $index) {
          <tr>
            <td>{{user.id}}</td>
            <td>{{user.name}}</td>
            <td>{{user.age}}</td>
            <td>{{user.sal}}</td>
            <td>{{user.gender}}</td>
            <td>
              <button class="btn btn-danger" (click)="deleteUser(user.id)">Delete</button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="col-sm-4">
      <p>Name: <input #name /></p>
      <p>Age: <input #age /></p>
      <p>sal: <input #sal /></p>
      <p>gender: <input #gender /></p>
      
      <button (click)="addUser(name.value,age.value,sal.value,gender.value)">Add user</button>
    </div>
  </div>
</div>
